name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      # The tests that talk to GitHub and Google Calendar are gated behind
      # LIVE=1, so the suite runs offline with no credentials.
      #
      # -count=1 defeats Go's test cache. The toolchain cache above restores
      # results from earlier runs, so a package whose inputs have not changed
      # reports "(cached)" and never actually executes — which is exactly the
      # run where a flake or an environment difference would have shown up.
      - name: go test
        run: go test -race -count=1 ./...

      - name: go build
        run: go build ./...
